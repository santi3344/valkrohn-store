<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colección | VALKROHN</title>
    <meta name="description" content="Explora nuestra colección de ropa urbana premium." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand"><img src="assets/valkrohn-logo.svg" alt="" /> <span>VALKROHN</span></a>
        <nav class="main-nav" aria-label="Navegación principal">
          <a href="index.html">Inicio</a>
          <a href="catalog.html" class="active">Colección</a>
          <a href="product.html?id=1">Nuevo</a>
          <a href="contact.html">Contacto</a>
        </nav>
        <div class="nav-tools">
          <a href="catalog.html" class="nav-link">Buscar</a>
          <a href="cart.html" class="nav-link cart-link">
            <span class="cart-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 1.9-1.4L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg></span>
            Carrito
            <span class="cart-badge">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="page-content">
      <section class="container page-intro">
        <p class="eyebrow dark">Colección</p>
        <h1>Moda para cada día.</h1>
      </section>

      <section class="container catalog-toolbar">
        <div class="toolbar-row">
          <div class="filter-group" aria-label="Filtros de productos">
            <button class="filter-button active" data-filter="all">Todo</button>
            <button class="filter-button" data-filter="chaquetas">Chaquetas</button>
            <button class="filter-button" data-filter="pantalones">Pantalones</button>
            <button class="filter-button" data-filter="sudaderas">Sudaderas</button>
            <button class="filter-button" data-filter="accesorios">Accesorios</button>
          </div>

          <div class="catalog-controls">
            <label class="search-box" aria-label="Buscar producto">
              <input type="search" id="search-input" placeholder="Buscar producto" />
            </label>
            <select id="sort-select" aria-label="Ordenar por">
              <option value="featured">Destacados</option>
              <option value="price-asc">Precio: menor a mayor</option>
              <option value="price-desc">Precio: mayor a menor</option>
              <option value="name">Nombre</option>
            </select>
          </div>
        </div>
      </section>

      <section class="container">
        <div id="product-grid" class="product-grid catalog-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <div>
          <a href="index.html" class="brand footer-brand"><img src="assets/valkrohn-logo.svg" alt="" /> <span>VALKROHN</span></a>
        </div>
        <div class="footer-links">
          <a href="catalog.html">Colección</a>
          <a href="checkout.html">Pago</a>
          <a href="contact.html">Ayuda</a>
        </div>
        <p>© 2026 VALKROHN</p>
      </div>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
